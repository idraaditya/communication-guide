name: Export PDF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint fonts-dejavu-core fonts-liberation2
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint
      
      - name: Generate PDF
        run: |
          # Create combined markdown with proper ordering
          python scripts/generate_pdf_markdown.py > combined.md
          
          # Generate PDF with weasyprint (better CSS support)
          pandoc combined.md \
            -o communication-guide.pdf \
            --pdf-engine=weasyprint \
            --toc \
            --toc-depth=3 \
            --number-sections \
            --metadata title="Communication Protocols Guide for Embedded Devices" \
            --metadata author="Communication Guide Contributors" \
            --metadata date="$(date +%Y-%m-%d)" \
            --css=scripts/pdf-styles.css \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            --variable linestretch=1.2
      
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: communication-guide-pdf
          path: communication-guide.pdf
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: communication-guide.pdf
          generate_release_notes: true